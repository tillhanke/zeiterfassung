{% extends "base.html" %}
{% block title %}Einstellungen – Verwaltung{% endblock %}
{% block content %}

<a class="btn btn-link text-decoration-none px-0 mb-2" href="{{ url_for('admin') }}">← Übersicht</a>
<h1 class="h3 mb-1">Einstellungen</h1>
<p class="text-muted mb-4">Gelten für alle Nutzerinnen.</p>

<form method="post" action="{{ url_for('admin_settings') }}">
  <section class="card mb-3">
    <div class="card-body">
      <div class="form-check form-switch mb-1">
        <input class="form-check-input" type="checkbox" role="switch" id="yearly_reset"
               name="yearly_reset" value="1" {% if yearly_reset %}checked{% endif %} />
        <label class="form-check-label fw-semibold" for="yearly_reset">
          Saldo zum Jahreswechsel auf 0 setzen
        </label>
      </div>
      <p class="form-text mb-0">
        An: Jedes Jahr beginnt mit ±0:00 h. Aus: Über- und Minusstunden werden ins neue Jahr
        übernommen.
      </p>
    </div>
  </section>

  <button class="btn btn-primary" type="submit">Speichern</button>
</form>
{% endblock %}
