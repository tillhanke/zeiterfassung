{% extends "base.html" %}
{% block title %}Tag eintragen – {{ user.name }}{% endblock %}
{% block content %}
<div class="row">
  <div class="col-lg-8 mx-auto">
    <h1 class="h3 mb-3">Tag eintragen für {{ user.name }}</h1>

    <form method="post" class="card card-body shadow-sm" id="entryForm">
      <div class="mb-3">
        <label class="form-label">Datum</label>
        <input type="date" name="date" class="form-control" required
               value="{{ prefill_date or today.isoformat() }}" />
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Typ</label>
        <div class="btn-group" role="group" aria-label="Eintragstyp">
          <input type="radio" class="btn-check" name="kind" id="kindWork" value="work" checked />
          <label class="btn btn-outline-primary" for="kindWork">Arbeit</label>

          <input type="radio" class="btn-check" name="kind" id="kindVacation" value="vacation" />
          <label class="btn btn-outline-warning" for="kindVacation">Urlaub</label>

          <input type="radio" class="btn-check" name="kind" id="kindSick" value="sick" />
          <label class="btn btn-outline-danger" for="kindSick">Krank</label>
        </div>
      </div>

      {% include "_work_windows.html" %}

      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit">Speichern</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('user_dashboard', user_id=user.id) }}">
          Abbrechen
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
