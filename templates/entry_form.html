{% extends "base.html" %}
{% block title %}Tag eintragen – {{ user.name }}{% endblock %}
{% block content %}
<div class="row">
  <div class="col-lg-8 mx-auto">
    <h1 class="h3 mb-3">Tag eintragen für {{ user.name }}</h1>

    <form method="post" class="card card-body shadow-sm" id="entryForm">
      <div class="mb-3">
        <label class="form-label">Datum</label>
        <input type="date" name="date" class="form-control" required
               value="{{ prefill_date or today.isoformat() }}" />
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Typ</label>
        <div class="btn-group" role="group" aria-label="Eintragstyp">
          <input type="radio" class="btn-check" name="kind" id="kindWork" value="work" checked />
          <label class="btn btn-outline-primary" for="kindWork">Arbeit</label>

          <input type="radio" class="btn-check" name="kind" id="kindVacation" value="vacation" />
          <label class="btn btn-outline-warning" for="kindVacation">Urlaub</label>

          <input type="radio" class="btn-check" name="kind" id="kindSick" value="sick" />
          <label class="btn btn-outline-danger" for="kindSick">Krank</label>
        </div>
      </div>

      <div id="workFields">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Startzeit</label>
            <input type="time" name="start_time" id="startTime" class="form-control" value="09:00" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Endzeit</label>
            <input type="time" name="end_time" id="endTime" class="form-control" value="17:30" />
          </div>
        </div>
        <div class="alert alert-info mt-3 mb-0" id="livePreview">
          <span id="grossText">–</span>
          <span class="mx-1">·</span>
          <span id="breakText">–</span>
          <span class="mx-1">·</span>
          <strong id="netText">–</strong>
          <span class="mx-1">·</span>
          <span id="diffText" class="text-muted"></span>
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit">Speichern</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('user_dashboard', user_id=user.id) }}">
          Abbrechen
        </a>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    const form = document.getElementById('entryForm');
    const radios = form.querySelectorAll('input[name="kind"]');
    const workFields = document.getElementById('workFields');
    const startEl = document.getElementById('startTime');
    const endEl = document.getElementById('endTime');
    const grossText = document.getElementById('grossText');
    const breakText = document.getElementById('breakText');
    const netText = document.getElementById('netText');
    const diffText = document.getElementById('diffText');

    const dailyTarget = {{ user.daily_target }};

    function legalBreak(g) {
      if (g > 9) return 0.75;
      if (g > 6) return 0.5;
      return 0;
    }

    function fmt(n) { return n.toFixed(2) + ' h'; }

    function update() {
      const kind = form.querySelector('input[name="kind"]:checked').value;
      workFields.style.display = (kind === 'work') ? '' : 'none';
      if (kind !== 'work') return;

      const s = startEl.value, e = endEl.value;
      if (!s || !e) { grossText.textContent = '–'; netText.textContent = '–'; breakText.textContent = '–'; diffText.textContent = ''; return; }
      const [sh, sm] = s.split(':').map(Number);
      const [eh, em] = e.split(':').map(Number);
      const gross = ((eh * 60 + em) - (sh * 60 + sm)) / 60;
      if (gross <= 0) { grossText.textContent = 'Endzeit muss nach Startzeit liegen'; netText.textContent = '–'; breakText.textContent = '–'; diffText.textContent = ''; return; }
      const br = legalBreak(gross);
      const net = gross - br;
      grossText.textContent = 'Brutto ' + fmt(gross);
      breakText.textContent = 'Pause ' + (br * 60).toFixed(0) + ' min';
      netText.textContent = 'Netto ' + fmt(net);
      const diff = net - dailyTarget;
      diffText.textContent = '(' + (diff >= 0 ? '+' : '') + diff.toFixed(2) + ' h ggü. Soll)';
    }

    radios.forEach(r => r.addEventListener('change', update));
    startEl.addEventListener('input', update);
    endEl.addEventListener('input', update);
    update();
  })();
</script>
{% endblock %}
